name: sync_pai
description: "SyncPai - Anime streaming with real-time synchronized playback."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^8.1.6

  # DI & Routing
  get_it: ^8.0.3
  injectable: ^2.5.0
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0
  dio_smart_retry: ^6.0.0

  # Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.7
  csv: ^6.0.0

  # UI, Fonts & Images
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Media & System
  wakelock_plus: ^1.2.8
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.4

  # Realtime & Storage
  supabase_flutter: ^2.8.1
  shared_preferences: ^2.3.3
  qr_flutter: ^4.1.0
  file_picker: ^8.1.7
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  mobile_scanner: ^7.5.0
  palette_generator: ^0.3.3+7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  injectable_generator: ^2.6.2

flutter:
  uses-material-design: true
