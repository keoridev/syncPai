<!DOCTYPE html>
<html>
<head>

    This is a placeholder for base href that will be replaced by the value of

  -->

  <meta charset="UTF-8">

  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="sync_pai">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>sync_pai</title>
  <link rel="manifest" href="manifest.json">

  <!-- HLS.js for full HLS/m3u8 streaming support in Google Chrome, Edge & Firefox -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    // Автоматическая поддержка HLS (.m3u8) потоков в Google Chrome, Edge и Firefox через HLS.js
    (function() {
      function hookVideoPrototype() {
        if (typeof Hls === 'undefined') return;
        if (!Hls.isSupported()) return;

        var origDescriptor = Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, 'src');
        if (!origDescriptor || !origDescriptor.set) return;

        var originalSet = origDescriptor.set;
        Object.defineProperty(HTMLMediaElement.prototype, 'src', {
          set: function(val) {
            if (typeof val === 'string' && val.indexOf('.m3u8') !== -1 && !this.canPlayType('application/vnd.apple.mpegurl')) {
              if (this._hls) {
                this._hls.destroy();
                this._hls = null;
              }
              var hls = new Hls({
                enableWorker: true,
                lowLatencyMode: true,
                backBufferLength: 90
              });
              hls.loadSource(val);
              hls.attachMedia(this);
              this._hls = hls;
              return;
            }
            if (this._hls) {
              this._hls.destroy();
              this._hls = null;
            }
            originalSet.call(this, val);
          },
          get: origDescriptor.get,
          configurable: true,
          enumerable: true
        });
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', hookVideoPrototype);
      } else {
        hookVideoPrototype();
      }
    })();
  </script>
</head>
<body>
  <!--

</body>
